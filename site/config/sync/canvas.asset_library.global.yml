id: global
label: 'Global CSS'
css:
  original: |
    /*
     * Ensure your theme imports the font you're using in this file.
     * Alternatively, you can load fonts purely in Code Components by importing a
     * CSS file with the font declarations from a URL, i.e. a CDN. For example, you
     * can uncomment the following line to use the Inter font.
     * For local development, Workbench loads the global CSS file configured in
     * canvas.config.json.
     */
    /* @import url("https://rsms.me/inter/inter.css"); */

    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Lora:ital,wght@0,400..700;1,400..700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Lora:ital,wght@0,400..700;1,400..700&display=swap');

    @import 'tailwindcss';

    @theme {
      --font-display: 'Bricolage Grotesque', sans-serif;
      --font-sans: 'DM Sans', sans-serif;
      --color-cream: #fff4dc;
      --color-ink: #17163a;
      --color-coral: #ff5c4d;
      --color-fun-blue: #3b5bff;
      --color-sun: #ffd84d;
      --color-muted: #6b6a85;

      /* A small bounce for the swarm's dots when the room is having a great time. */
      --animate-wiggle: wiggle 0.7s ease-in-out infinite;

      /* A new comment slides in. */
      @keyframes comment-in {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
    }

    /*
     * The room's mood. The swarm component writes the room's steadied tier onto <html>
     * as data-mood="waiting|low|mid|high"; these tokens turn it into colors, and the
     * room page's components read them (bg-mood-bg, bg-mood-field, bg-mood-accent).
     * Text stays dark ink on every background; check contrast when changing a color.
     */
    :root {
      --mood-bg: #fff4dc;
      --mood-field: #fff4dc;
      --mood-accent: #3b5bff;
    }

    html[data-mood='low'] {
      --mood-bg: #cdd7f0;
      --mood-field: #e6ecfa;
      --mood-accent: #3b5bff;
    }

    html[data-mood='mid'] {
      --mood-bg: #ffe2a0;
      --mood-field: #fff4dc;
      --mood-accent: #e5412f;
    }

    html[data-mood='high'] {
      --mood-bg: #ff9a72;
      --mood-field: #ffe27a;
      --mood-accent: #d6006f;
    }

    /* Cover the whole window, not just the room's box, and fade between moods. */
    html[data-mood] body {
      background-color: var(--mood-bg);
    }

    @media (prefers-reduced-motion: no-preference) {
      html[data-mood] body {
        transition: background-color 1.5s ease;
      }
    }

    @theme inline {
      --color-mood-bg: var(--mood-bg);
      --color-mood-field: var(--mood-field);
      --color-mood-accent: var(--mood-accent);
    }
