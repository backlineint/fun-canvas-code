fun_room.presenter_slide:
  path: '/api/fun/rooms/{code}/slide'
  defaults:
    _controller: 'Drupal\fun_room\Controller\PresenterController::slide'
  methods: [POST]
  requirements:
    # Not session based: the controller checks the shared X-Presenter-Key.
    _access: 'TRUE'

fun_room.state:
  path: '/api/fun/rooms/{code}/state'
  defaults:
    _controller: 'Drupal\fun_room\Controller\LiveController::state'
  methods: [GET]
  requirements:
    # Public and read-only: nothing in it identifies a person.
    _access: 'TRUE'

fun_room.vote:
  path: '/api/fun/rooms/{code}/vote'
  defaults:
    _controller: 'Drupal\fun_room\Controller\LiveController::vote'
  methods: [POST]
  requirements:
    # Not session based: the controller checks the attendee's X-Participant-Token.
    _access: 'TRUE'

fun_room.comments_list:
  path: '/api/fun/rooms/{code}/comments'
  defaults:
    _controller: 'Drupal\fun_room\Controller\CommentController::list'
  methods: [GET]
  requirements:
    # Public and read-only: comments show only the name and avatar the attendee chose.
    _access: 'TRUE'

fun_room.comments_post:
  path: '/api/fun/rooms/{code}/comments'
  defaults:
    _controller: 'Drupal\fun_room\Controller\CommentController::post'
  methods: [POST]
  requirements:
    # Authorised by the participant's token inside the controller.
    _access: 'TRUE'

fun_room.ratings_list:
  path: '/api/fun/rooms/{code}/ratings'
  defaults:
    _controller: 'Drupal\fun_room\Controller\RatingController::list'
  methods: [GET]
  requirements:
    # Public and read-only: ratings show only the name and avatar the attendee chose.
    _access: 'TRUE'

fun_room.requests_list:
  path: '/api/fun/rooms/{code}/requests'
  defaults:
    _controller: 'Drupal\fun_room\Controller\RequestController::list'
  methods: [GET]
  requirements:
    # Public and read-only: requests show only the name, avatar and note the attendee gave.
    _access: 'TRUE'

fun_room.requests_make:
  path: '/api/fun/rooms/{code}/requests'
  defaults:
    _controller: 'Drupal\fun_room\Controller\RequestController::make'
  methods: [POST]
  requirements:
    # Authorised by the participant's token inside the controller.
    _access: 'TRUE'

fun_room.requests_cancel:
  path: '/api/fun/rooms/{code}/requests/{id}/cancel'
  defaults:
    _controller: 'Drupal\fun_room\Controller\RequestController::cancel'
  methods: [POST]
  requirements:
    _access: 'TRUE'
    id: '\d+'

fun_room.requests_deliver:
  path: '/api/fun/rooms/{code}/requests/{id}/deliver'
  defaults:
    _controller: 'Drupal\fun_room\Controller\RequestController::deliver'
  methods: [POST]
  requirements:
    # Authorised by the presenter key inside the controller.
    _access: 'TRUE'
    id: '\d+'
