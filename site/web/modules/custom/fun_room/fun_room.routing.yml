fun_room.presenter_slide:
  path: '/api/fun/rooms/{code}/slide'
  defaults:
    _controller: 'Drupal\fun_room\Controller\PresenterController::slide'
  methods: [POST]
  requirements:
    # Not session based: the controller checks the shared X-Presenter-Key.
    _access: 'TRUE'

fun_room.state:
  path: '/api/fun/rooms/{code}/state'
  defaults:
    _controller: 'Drupal\fun_room\Controller\LiveController::state'
  methods: [GET]
  requirements:
    # Public and read-only: nothing in it identifies a person.
    _access: 'TRUE'

fun_room.vote:
  path: '/api/fun/rooms/{code}/vote'
  defaults:
    _controller: 'Drupal\fun_room\Controller\LiveController::vote'
  methods: [POST]
  requirements:
    # Not session based: the controller checks the attendee's X-Participant-Token.
    _access: 'TRUE'

fun_room.comments_list:
  path: '/api/fun/rooms/{code}/comments'
  defaults:
    _controller: 'Drupal\fun_room\Controller\CommentController::list'
  methods: [GET]
  requirements:
    # Public and read-only: comments show only the name and avatar the attendee chose.
    _access: 'TRUE'

fun_room.comments_post:
  path: '/api/fun/rooms/{code}/comments'
  defaults:
    _controller: 'Drupal\fun_room\Controller\CommentController::post'
  methods: [POST]
  requirements:
    # Authorised by the participant's token inside the controller.
    _access: 'TRUE'
