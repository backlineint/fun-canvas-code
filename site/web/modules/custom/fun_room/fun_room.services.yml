services:
  fun_room.join_flood_subscriber:
    class: Drupal\fun_room\EventSubscriber\JoinFloodSubscriber
    arguments: ['@flood']
    tags:
      - { name: event_subscriber }

  fun_room.vote_recorder:
    class: Drupal\fun_room\VoteRecorder
    arguments: ['@entity_type.manager', '@database', '@lock', '@datetime.time']

  fun_room.swarm_state:
    class: Drupal\fun_room\SwarmState
    arguments: ['@database', '@cache.default', '@datetime.time']
