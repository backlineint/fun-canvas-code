name: Recap
machineName: recap
status: true
required:
  - code
props:
  properties:
    code:
      title: Code
      description: The room code, such as NED-4261.
      type: string
      examples:
        - NED-4261
    pollMs:
      title: Poll ms
      description:
        How often to refresh the recap, in milliseconds. 30000 is a good
        default; 0 loads it once.
      type: integer
      examples:
        - 30000
slots: {}
